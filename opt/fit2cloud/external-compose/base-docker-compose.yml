services:
  management-center:
    profiles: ["standard"]
    image: ${IMAGE_ADDRESS}/management-center:${VERSION}
    container_name: management-center
    restart: always
    volumes:
      - share-volume:/opt/fit2cloud/share/plugins
      - host-opt-fit2cloud-conf:/opt/fit2cloud/conf
      - host-opt-fit2cloud-logs:/opt/fit2cloud/logs
    mem_limit: 2048m
    logging:
      driver: "json-file"
      options:
        max-size: "25M"
        max-file: "4"
    networks:
      - cmp-network

  gateway:
    profiles: ["standard"]
    image: ${IMAGE_ADDRESS}/gateway:${VERSION}
    container_name: gateway
    restart: always
    ports:
      - "0.0.0.0:${CE_ACCESS_PORT:-80}:6601"
    volumes:
      - host-opt-fit2cloud-conf:/opt/fit2cloud/conf
      - host-opt-fit2cloud-logs:/opt/fit2cloud/logs
    depends_on:
      management-center:
        condition: service_healthy
      keycloak:
        condition: service_healthy
        required: false
    mem_limit: 2048m
    logging:
      driver: "json-file"
      options:
        max-size: "25M"
        max-file: "4"
    networks:
      - cmp-network

  dashboard:
    profiles: ["standard"]
    image: ${IMAGE_ADDRESS}/dashboard:${VERSION}
    container_name: dashboard
    restart: always
    volumes:
      - host-opt-fit2cloud-conf:/opt/fit2cloud/conf
      - host-opt-fit2cloud-logs:/opt/fit2cloud/logs
    depends_on:
      management-center:
        condition: service_healthy
    mem_limit: 1024m
    logging:
      driver: "json-file"
      options:
        max-size: "25M"
        max-file: "4"
    networks:
      - cmp-network

  vm-service:
    profiles: ["standard"]
    image: ${IMAGE_ADDRESS}/vm-service:${VERSION}
    container_name: vm-service
    restart: always
    volumes:
      - share-volume:/opt/fit2cloud/share/plugins
      - host-opt-fit2cloud-conf:/opt/fit2cloud/conf
      - host-opt-fit2cloud-logs:/opt/fit2cloud/logs
      - ${CE_INSTALL_PATH}/fit2cloud/middleware_init:/opt/fit2cloud/middleware_init
    depends_on:
      management-center:
        condition: service_healthy
    mem_limit: 2048m
    logging:
      driver: "json-file"
      options:
        max-size: "25M"
        max-file: "4"
    networks:
      - cmp-network

  operation-analytics:
    profiles: ["standard"]
    image: ${IMAGE_ADDRESS}/operation-analytics:${VERSION}
    container_name: operation-analytics
    restart: always
    volumes:
      - share-volume:/opt/fit2cloud/share/plugins
      - host-opt-fit2cloud-conf:/opt/fit2cloud/conf
      - host-opt-fit2cloud-logs:/opt/fit2cloud/logs
    depends_on:
      management-center:
        condition: service_healthy
    mem_limit: 2048m
    logging:
      driver: "json-file"
      options:
        max-size: "25M"
        max-file: "4"
    networks:
      - cmp-network

  screen-display:
    profiles: ["standard"]
    image: ${IMAGE_ADDRESS}/screen-display:${VERSION}
    container_name: screen-display
    restart: always
    volumes:
      - share-volume:/opt/fit2cloud/share/plugins
      - host-opt-fit2cloud-conf:/opt/fit2cloud/conf
      - host-opt-fit2cloud-logs:/opt/fit2cloud/logs
    depends_on:
      management-center:
        condition: service_healthy
    mem_limit: 1024m
    logging:
      driver: "json-file"
      options:
        max-size: "25M"
        max-file: "4"
    networks:
      - cmp-network

  billing-center:
    profiles: ["standard"]
    image: ${IMAGE_ADDRESS}/billing-center:${VERSION}
    container_name: billing-center
    restart: always
    volumes:
      - share-volume:/opt/fit2cloud/share/plugins
      - host-opt-fit2cloud-conf:/opt/fit2cloud/conf
      - host-opt-fit2cloud-logs:/opt/fit2cloud/logs
    depends_on:
      management-center:
        condition: service_healthy
    mem_limit: 2048m
    logging:
      driver: "json-file"
      options:
        max-size: "25M"
        max-file: "4"
    networks:
      - cmp-network

  orchestrator-service:
    profiles: ["standard"]
    image: ${IMAGE_ADDRESS}/orche:${VERSION}
    container_name: orchestrator-service
    restart: always
    volumes:
      - share-volume:/opt/fit2cloud/share/plugins
      - host-opt-fit2cloud-conf:/opt/fit2cloud/conf
      - host-opt-fit2cloud-logs:/opt/fit2cloud/logs
      - host-opt-fit2cloud-sftp-upload:/opt/fit2cloud/sftp/sftpuser/upload
    depends_on:
      management-center:
        condition: service_healthy
    mem_limit: 2048m
    logging:
      driver: "json-file"
      options:
        max-size: "25M"
        max-file: "4"
    networks:
      - cmp-network

  cloud-worker:
    profiles: ["standard"]
    image: ${IMAGE_ADDRESS}/cloud-worker:${VERSION}
    container_name: cloud-worker
    restart: always
    volumes:
      - share-volume:/opt/fit2cloud/share/plugins
      - host-opt-fit2cloud-conf:/opt/fit2cloud/conf
      - host-opt-fit2cloud-logs:/opt/fit2cloud/logs
    depends_on:
      management-center:
        condition: service_healthy
    mem_limit: 1024m
    logging:
      driver: "json-file"
      options:
        max-size: "25M"
        max-file: "4"
    networks:
      - cmp-network

  message-worker:
    profiles: ["standard"]
    image: ${IMAGE_ADDRESS}/message-worker:${VERSION}
    container_name: message-worker
    restart: always
    volumes:
      - share-volume:/opt/fit2cloud/share/plugins
      - host-opt-fit2cloud-conf:/opt/fit2cloud/conf
      - host-opt-fit2cloud-logs:/opt/fit2cloud/logs
    depends_on:
      management-center:
        condition: service_healthy
    mem_limit: 1024m
    logging:
      driver: "json-file"
      options:
        max-size: "25M"
        max-file: "4"
    networks:
      - cmp-network

networks:
  cmp-network:
    external: true

volumes:
  share-volume:
    driver_opts:
      type: none
      device: ${CE_INSTALL_PATH}/fit2cloud/data/plugins
      o: bind
  host-opt-fit2cloud-conf:
    driver_opts:
      type: none
      device: ${CE_INSTALL_PATH}/fit2cloud/conf
      o: bind
  host-opt-fit2cloud-logs:
    driver_opts:
      type: none
      device: ${CE_INSTALL_PATH}/fit2cloud/logs
      o: bind
  host-opt-fit2cloud-git:
    driver_opts:
      type: none
      device: ${CE_INSTALL_PATH}/fit2cloud/git
      o: bind
  host-opt-fit2cloud-sftp-upload:
    driver_opts:
      type: none
      device: ${CE_INSTALL_PATH}/fit2cloud/sftp/sftpuser/upload
      o: bind
